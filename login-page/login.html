<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradex | Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Login CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="logo">
                <span class="logo-dot"></span>
                <h2>Gradex</h2>
            </div>
            <div class="content">
                <h1>Welcome Back!</h1>
                <p>
                    Continue your journey with Gradex and make grading
                    faster, smarter, and stress-free.
                </p>
                <ul>
                    <li># AI-Powered Grading</li>
                    <li># Instant Feedback</li>
                    <li># Smart Analytics</li>
                    <li># Secure & Reliable</li>
                </ul>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="login-card">
                <h2>Sign In</h2>
                <p>Login to your account</p>

                <form>
                    <div class="input-box">
                        <label>Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="input-box">
                        <label>Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit">
                        Sign In
                    </button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>
                <button class="google-btn">
                    Continue with Google
                </button>
                <p class="signup">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>
        </div>

    </div>
    <script src="login.js"></script>
</body>
</html>
